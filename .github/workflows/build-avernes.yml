name: AvernesSowtware 1.4.5 Windows release

on:
  push:
    branches: [work/1.4.4-build]
    paths:
      - '.github/workflows/build-avernes.yml'
      - '.github/build-input/patches_1_4_4.patch.gz.b64'
      - '.github/build-input/patches_1_4_5_hotfix.patch.gz.b64'
      - '.github/build-input/patches_1_4_5_fort_dispatch.patch.gz.b64'
      - 'tests/test_1_4_3_regressions.py'
      - 'tests/test_1_4_5_regressions.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.3 release source and package
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.4.3-RELEASE
          path: ${{ runner.temp }}/base
          repository: ${{ github.repository }}
          run-id: 44100884419
          github-token: ${{ github.token }}

      - name: Reconstruct v1.4.3 baseline
        shell: pwsh
        run: |
          $releaseZip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'base') -Filter 'AvernesSowtware_v1.4.3_RELEASE.zip' -Recurse | Select-Object -First 1
          if (-not $releaseZip) { throw 'Verified v1.4.3 release ZIP missing.' }
          $extract = Join-Path $env:RUNNER_TEMP 'src143'
          Expand-Archive $releaseZip.FullName $extract -Force
          $root = Join-Path $extract 'AvernesSowtware_v1.4.3'
          if (-not (Test-Path (Join-Path $root 'src\Core\AvernesSowtwareScript.cs'))) { throw 'Unexpected v1.4.3 package root.' }
          if (-not (Select-String -LiteralPath (Join-Path $root 'src\Core\AvernesSowtwareScript.cs') -SimpleMatch -Pattern 'private const string ProductVersion = "1.4.3";' -Quiet)) { throw 'Baseline source is not 1.4.3.' }
          git -C $root init -q
          "AVERNE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decode and apply v1.4.4 patch
        shell: pwsh
        run: |
          @'
          import gzip, hashlib, os
          from pathlib import Path
          patch = gzip.decompress(Path('.github/build-input/patches_1_4_4.patch.gz.b64').read_bytes())
          if hashlib.sha256(patch).hexdigest() != 'bae0298ca0e47fed45fe3cb0b9a1c894e43eabcdfb46e099d6c78ff1427ff80c':
              raise SystemExit('v1.4.4 patch SHA-256 mismatch')
          Path(os.environ['RUNNER_TEMP'], 'v144.patch').write_bytes(patch)
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'decode144.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'decode144.py')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.4 patch decode failed.' }
          git -C $env:AVERNE_ROOT apply --check --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v144.patch')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.4 patch does not apply to verified v1.4.3 baseline.' }
          git -C $env:AVERNE_ROOT apply --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v144.patch')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.4 patch application failed.' }
          if (-not (Select-String -LiteralPath (Join-Path $env:AVERNE_ROOT 'src\Core\AvernesSowtwareScript.cs') -SimpleMatch -Pattern 'private const string ProductVersion = "1.4.4";' -Quiet)) { throw 'Source version is not 1.4.4.' }

      - name: Decode and apply v1.4.5 hotfix patch
        shell: pwsh
        run: |
          @'
          import gzip, hashlib, os, base64
          from pathlib import Path
          encoded = Path('.github/build-input/patches_1_4_5_hotfix.patch.gz.b64').read_bytes()
          patch = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest() != '4092032647c8c6ac22506ab0692fe788b27d6b20123221fa4c4f046204c35d4e':
              raise SystemExit('v1.4.5 hotfix patch SHA-256 mismatch')
          Path(os.environ['RUNNER_TEMP'], 'v145.patch').write_bytes(patch)
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'decode145.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'decode145.py')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.5 hotfix patch decode failed.' }
          git -C $env:AVERNE_ROOT apply --check --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v145.patch')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.5 hotfix patch does not apply to v1.4.4 source.' }
          git -C $env:AVERNE_ROOT apply --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v145.patch')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.5 hotfix patch application failed.' }
          if (-not (Select-String -LiteralPath (Join-Path $env:AVERNE_ROOT 'src\Core\AvernesSowtwareScript.cs') -SimpleMatch -Pattern 'private const string ProductVersion = "1.4.5";' -Quiet)) { throw 'Source version is not 1.4.5.' }

      - name: Apply Fort Zancudo Army dispatch ID correction
        shell: pwsh
        run: |
          @'
          import gzip, hashlib, base64, os
          from pathlib import Path
          encoded = Path('.github/build-input/patches_1_4_5_fort_dispatch.patch.gz.b64').read_bytes()
          patch = gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(patch).hexdigest() != '2a402761931f9082614648abfe6a6fae4e4b0f0eaee38a6b2f0b2f3aeeaaa7a7':
              raise SystemExit('Fort dispatch patch SHA-256 mismatch')
          Path(os.environ['RUNNER_TEMP'], 'fort145.patch').write_bytes(patch)
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'decodefort145.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'decodefort145.py')
          if ($LASTEXITCODE -ne 0) { throw 'Fort dispatch patch decode failed.' }
          git -C $env:AVERNE_ROOT apply --check --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'fort145.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Fort dispatch patch does not apply to v1.4.5 entry-animation source.' }
          git -C $env:AVERNE_ROOT apply --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'fort145.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Fort dispatch patch application failed.' }

      - name: Run v1.4.5 regression tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          $testDir = Join-Path $env:AVERNE_ROOT 'tests'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tests\test_1_4_3_regressions.py') (Join-Path $testDir 'test_1_4_3_regressions.py') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tests\test_1_4_5_regressions.py') (Join-Path $testDir 'test_1_4_5_regressions.py') -Force
          Push-Location $env:AVERNE_ROOT
          python -m unittest discover -s tests -p 'test_*.py' -v
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'v1.4.5 regression tests failed.' }

      - name: Restore ScriptHookVDotNet2 API 2 reference
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'shvdn.nupkg'
          $zip = Join-Path $env:RUNNER_TEMP 'shvdn.zip'
          $out = Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $pkg
          Copy-Item $pkg $zip -Force
          Expand-Archive $zip $out -Force
          $refs = @(Get-ChildItem $out -Filter ScriptHookVDotNet2.dll -Recurse -File)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'SHVDN API2 reference invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile and package v1.4.5
        shell: pwsh
        run: |
          Push-Location $env:AVERNE_ROOT
          & cmd.exe /d /c 'BUILD_RELEASE.bat "" --no-pause'
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            foreach ($f in @('BUILD_RELEASE.log','AvernesSowtware_Build.log')) {
              if (Test-Path $f) { Get-Content $f -Raw | Write-Host }
            }
            Pop-Location
            throw 'v1.4.5 Windows release build failed.'
          }
          if (!(Test-Path 'dist\AvernesSowtware.dll') -or !(Test-Path 'dist\AvernesSowtware_v1.4.5_RELEASE.zip')) {
            Pop-Location
            throw 'v1.4.5 release outputs missing.'
          }
          if (Test-Path 'AvernesSowtware_Build.log') {
            if ((Get-Content 'AvernesSowtware_Build.log' -Raw) -match 'warning CS\d+') {
              Pop-Location
              throw 'C# compiler warnings found.'
            }
          }
          Pop-Location

      - name: Validate v1.4.5 release ZIP
        shell: pwsh
        run: |
          $path = Join-Path $env:AVERNE_ROOT 'dist\AvernesSowtware_v1.4.5_RELEASE.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($path)
          try {
            $n = @($z.Entries | ForEach-Object { $_.FullName.Replace([char]92,'/') })
            if ($n[0] -ne 'AvernesSowtware_v1.4.5/Install_AvernesSowtware.bat') { throw 'Installer is not first.' }
            $dll = @($n | Where-Object { $_ -match '\.dll$' })
            if ($dll.Count -ne 1 -or $dll[0] -ne 'AvernesSowtware_v1.4.5/dist/AvernesSowtware.dll') { throw 'Expected exactly one trainer DLL.' }
            foreach ($f in @('docs/CHANGELOG_1_4_5_RU.md','docs/TEST_REPORT_1_4_5_RU.md','vehicle_catalog.json','Vehicles/vehicles.json','addons.json')) {
              if (@($n | Where-Object { $_ -like "*/$f" }).Count -eq 0) { throw "Missing $f" }
            }
          } finally { $z.Dispose() }

      - name: Upload v1.4.5 release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.4.5-RELEASE
          path: ${{ env.AVERNE_ROOT }}/dist/AvernesSowtware_v1.4.5_RELEASE.zip
          if-no-files-found: error
          retention-days: 30
