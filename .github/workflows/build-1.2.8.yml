name: YnixTrainer 1.2.8 Windows release build
on:
  push:
    branches: [work/1.2.8-development]
    paths:
      - ".github/build-input/YnixTrainer_1.2.8_BUILD_INPUT_*.b64"
      - ".github/build-input/apply-1.2.8-build-fixes.ps1"
      - ".github/workflows/build-1.2.8.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        shell: pwsh
        run: |
          $chunks = Get-ChildItem ".github/build-input/YnixTrainer_1.2.8_BUILD_INPUT_*.b64" | Sort-Object Name
          if ($chunks.Count -ne 10) { throw "Expected 10 chunks; found $($chunks.Count)." }
          $encoded = ($chunks | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "ynix-source.tar.gz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $extract = Join-Path $env:RUNNER_TEMP "ynix-source"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar -xzf $archive -C $extract
          $root = Join-Path $extract "AvernesSowtware_v1.2.8"
          if (-not (Test-Path (Join-Path $root "BUILD_RELEASE.bat"))) { throw "Missing BUILD_RELEASE.bat." }
          "YNIX_PROJECT_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply reviewed source and build fixes
        shell: pwsh
        run: |
          & ".github/build-input/apply-1.2.8-build-fixes.ps1" -ProjectRoot $env:YNIX_PROJECT_ROOT
          if (-not (Select-String -Path (Join-Path $env:YNIX_PROJECT_ROOT "src\VehicleCatalog.cs") -Pattern "using GTA.Native;" -Quiet)) { throw "GTA.Native import fix did not apply." }
          if (-not (Select-String -Path (Join-Path $env:YNIX_PROJECT_ROOT "build\Build.bat") -Pattern "YNIX_SHVDN_DLL" -Quiet)) { throw "SHVDN2 path fix did not apply." }
      - name: Get ScriptHookVDotNet2 reference assembly
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "shvdn2.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP "shvdn2.zip"
          $dest = Join-Path $env:RUNNER_TEMP "shvdn2"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13" -OutFile $pkg
          Copy-Item $pkg $zip -Force
          Expand-Archive $zip $dest -Force
          $dll = Get-ChildItem $dest -Recurse -Filter "ScriptHookVDotNet2.dll" | Select-Object -First 1
          if (-not $dll) { throw "SHVDN2 2.10.13 DLL was not found." }
          "YNIX_SHVDN_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile C# sources, validate and package
        shell: pwsh
        run: |
          $root = $env:YNIX_PROJECT_ROOT
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw ".NET Framework C# compiler not found." }
          $dist = Join-Path $root "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $dll = Join-Path $dist "YnixTrainerExtended.dll"
          $compileLog = Join-Path $root "YnixTrainer_Build.log"
          $trainerArgs = @(
            "/nologo","/target:library","/platform:anycpu","/langversion:4","/optimize+","/warn:4",
            "/out:$dll","/reference:$env:YNIX_SHVDN_DLL","/reference:System.dll",
            "/reference:System.Core.dll","/reference:System.Web.Extensions.dll",
            "/reference:System.Windows.Forms.dll",
            (Join-Path $root "src\YnixTrainerExtended.cs"),
            (Join-Path $root "src\VehicleSystems.cs"),
            (Join-Path $root "src\VehicleCatalog.cs"),
            (Join-Path $root "src\SettingsPersistence.cs"),
            (Join-Path $root "src\Atlas.cs"),
            (Join-Path $root "src\Wardrobe.cs")
          )
          Push-Location $root
          try {
            & $csc @trainerArgs *> $compileLog
            $compileExit = $LASTEXITCODE
            if (Test-Path $compileLog) { Get-Content $compileLog }
            if ($compileExit -ne 0) { throw "Trainer C# compilation failed with exit code $compileExit." }
            if (-not (Test-Path $dll) -or (Get-Item $dll).Length -le 0) { throw "Compiled trainer DLL is missing or empty." }

            $validator = Join-Path $root "build\ReleaseValidator.exe"
            & $csc /nologo /target:exe /platform:anycpu /langversion:4 /optimize+ /warn:4 "/out:$validator" /reference:System.dll /reference:System.Core.dll /reference:System.Web.Extensions.dll (Join-Path $root "build\ReleaseValidator.cs")
            if ($LASTEXITCODE -ne 0) { throw "ReleaseValidator compilation failed." }
            & $validator $root
            if ($LASTEXITCODE -ne 0) { throw "Release pre-package validation failed." }

            $report = Join-Path $root "BUILD_RELEASE_REPORT_RU.txt"
            @(
              "YnixTrainer Extended 1.2.8 - RELEASE BUILD REPORT"
              ""
              "Build: SUCCESS"
              "C# trainer compilation: PASSED (C# 4 / .NET Framework 4.0 API target)"
              "SHVDN2 reference: PASSED"
              "Pre-package validation: PASSED"
              "GTA V installation: NOT RUN"
              "GTA V Story Mode runtime testing: REQUIRED"
              ""
              "This report confirms compile-time and package validation only. It does not claim in-game runtime QA."
            ) | Set-Content -Path $report -Encoding UTF8

            $packager = Join-Path $root "build\ReleasePackager.exe"
            & $csc /nologo /target:exe /platform:anycpu /langversion:4 /optimize+ /warn:4 "/out:$packager" /reference:System.dll /reference:System.Core.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll (Join-Path $root "build\ReleasePackager.cs")
            if ($LASTEXITCODE -ne 0) { throw "ReleasePackager compilation failed." }
            $release = Join-Path $dist "AvernesSowtware_v1.2.8_RELEASE.zip"
            & $packager $root $release "1.2.8"
            if ($LASTEXITCODE -ne 0) { throw "Release ZIP packaging failed." }
            if (-not (Test-Path $release)) { throw "Release ZIP was not produced." }

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zr = [IO.Compression.ZipFile]::OpenRead($release)
            try {
              $names = @($zr.Entries | ForEach-Object { $_.FullName.Replace([char]92, '/') })
              $dllEntries = @($names | Where-Object { $_.EndsWith('/dist/YnixTrainerExtended.dll', [StringComparison]::OrdinalIgnoreCase) })
              if ($dllEntries.Count -lt 1) { throw "Compiled trainer DLL missing from ZIP. Entries: $($names -join '; ')" }
              $roots = @($names | Where-Object { $_ } | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
              if ($roots.Count -ne 1 -or $roots[0] -ne "AvernesSowtware_v1.2.8") { throw "Bad archive root: $($roots -join ', ')." }
              Write-Host "RELEASE ZIP VALID: $release; entries=$($names.Count)"
              Write-Host "COMPILED DLL: $($dllEntries[0])"
            } finally { $zr.Dispose() }

            $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-artifact"
            New-Item $artifactDir -ItemType Directory -Force | Out-Null
            Copy-Item $release (Join-Path $artifactDir "AvernesSowtware_v1.2.8_RELEASE.zip") -Force
          } finally { Pop-Location }
      - name: Upload full 1.2.8 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.2.8-RELEASE
          path: release-artifact/AvernesSowtware_v1.2.8_RELEASE.zip
          if-no-files-found: error
          retention-days: 14
