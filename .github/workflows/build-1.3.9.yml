name: AvernesSowtware 1.3.9 Windows build and installer validation

on:
  push:
    branches:
      - work/1.3.9-build
    tags:
      - v1.3.9
    paths:
      - '.github/build-input/patches_1_3_9.ready'
      - '.github/build-input/patches_1_3_9.part*.b64'
      - '.github/build-input/patches_1_3_9_postfix.patch.gz.b64'
      - '.github/workflows/build-1.3.9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: avernes-1-3-9-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout build manifest and patch payload
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified 1.3.8 baseline release artifact
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.3.8-RELEASE
          path: ${{ runner.temp }}/averne-v138-artifact
          repository: ${{ github.repository }}
          run-id: 43752575095
          github-token: ${{ github.token }}

      - name: Reassemble and verify 1.3.9 patch
        shell: pwsh
        run: |
          $env:PATCH_OUTPUT = Join-Path $env:RUNNER_TEMP 'averne-1.3.9.patch'
          @'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".github" / "build-input"
          parts = sorted(root.glob("patches_1_3_9.part*.b64"))
          if len(parts) != 12:
              raise SystemExit(f"Expected 12 patch chunks; found {len(parts)}")
          compressed = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in parts), validate=True)
          if hashlib.sha256(compressed).hexdigest() != "825fcc71801125b9d79ce51f9ee5ea7690fbf97aed6d750efe46a6d8bb4ec913":
              raise SystemExit("Compressed 1.3.9 patch SHA-256 mismatch")
          patch = lzma.decompress(compressed)
          expected = "3b69c09bfd9ea46b249246cc809cfeb8683795a4356d4d318013c0ad10c32471"
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f"Expanded 1.3.9 patch SHA-256 mismatch: {actual}")
          Path(os.environ["PATCH_OUTPUT"]).write_bytes(patch)
          print(f"Verified 1.3.9 patch: {len(patch)} bytes; SHA-256 {actual}")
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'prepare_139_patch.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'prepare_139_patch.py')
          if ($LASTEXITCODE -ne 0) { throw '1.3.9 patch reconstruction/checksum failed.' }

      - name: Apply patch to verified 1.3.8 source release
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'averne-v138-artifact'
          $baselineZip = Get-ChildItem -LiteralPath $artifactDir -Filter '*.zip' -File -Recurse | Select-Object -First 1
          if (-not $baselineZip) { throw 'Verified 1.3.8 release ZIP is missing from the workflow artifact.' }
          $extract = Join-Path $env:RUNNER_TEMP 'averne-v138-source'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $baselineZip.FullName -DestinationPath $extract -Force
          $roots = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($roots.Count -ne 1 -or $roots[0].Name -ne 'AvernesSowtware_v1.3.8') { throw 'Unexpected 1.3.8 release ZIP root.' }
          $root = $roots[0].FullName
          git -C $root init -q
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize isolated patch workspace.' }
          git -C $root apply --check --whitespace=nowarn $env:RUNNER_TEMP\averne-1.3.9.patch
          if ($LASTEXITCODE -ne 0) { throw '1.3.9 patch does not apply cleanly to verified 1.3.8.' }
          git -C $root apply --whitespace=nowarn $env:RUNNER_TEMP\averne-1.3.9.patch
          if ($LASTEXITCODE -ne 0) { throw 'Applying 1.3.9 patch failed.' }
          $env:POSTFIX_SOURCE = Join-Path $env:GITHUB_WORKSPACE '.github\build-input\patches_1_3_9_postfix.patch.gz.b64'
          $env:POSTFIX_OUTPUT = Join-Path $env:RUNNER_TEMP 'averne-1.3.9-cleanup.patch'
          @'
          import base64, gzip, hashlib, os
          from pathlib import Path
          compressed = base64.b64decode(Path(os.environ["POSTFIX_SOURCE"]).read_text(encoding="ascii").strip(), validate=True)
          if hashlib.sha256(compressed).hexdigest() != "f624252939a2a29c7fffa34e163b3853af1b12f1724577ad7f0cb242abc8620a":
              raise SystemExit("Compressed 1.3.9 cleanup patch SHA-256 mismatch")
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != "48dc956e9984cde34aa8f7d907d8b1312ff2b219bfc562c169e136c09456cea1":
              raise SystemExit("Expanded 1.3.9 cleanup patch SHA-256 mismatch")
          Path(os.environ["POSTFIX_OUTPUT"]).write_bytes(patch)
          print("Verified final 1.3.9 cleanup patch:", len(patch), "bytes")
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'prepare_139_cleanup.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'prepare_139_cleanup.py')
          if ($LASTEXITCODE -ne 0) { throw '1.3.9 cleanup patch checksum validation failed.' }
          git -C $root apply --check --whitespace=nowarn $env:POSTFIX_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw '1.3.9 cleanup patch does not apply cleanly.' }
          git -C $root apply --whitespace=nowarn $env:POSTFIX_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Applying 1.3.9 cleanup patch failed.' }
          $main = Join-Path $root 'src\Core\AvernesSowtwareScript.cs'
          if (-not (Select-String -LiteralPath $main -Pattern 'ProductVersion\s*=\s*"1\.3\.9"' -Quiet)) { throw 'Patched source is not version 1.3.9.' }
          if (-not (Test-Path (Join-Path $root 'tests\test_1_3_9_regressions.py'))) { throw '1.3.9 regression tests are missing.' }
          "AVERNE_PROJECT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host '1.3.9 patch applied to the verified CI-produced 1.3.8 baseline.'

      - name: Run all 1.3.9 regression tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          Push-Location $env:AVERNE_PROJECT_ROOT
          try {
            python -m unittest discover -s tests -p 'test_*.py' -v
            if ($LASTEXITCODE -ne 0) { throw '1.3.9 regression tests failed.' }
          } finally { Pop-Location }

      - name: Restore pinned ScriptHookVDotNet2 compiler reference
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'ScriptHookVDotNet2.2.10.13.nupkg'
          $packageZip = Join-Path $env:RUNNER_TEMP 'ScriptHookVDotNet2.2.10.13.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ScriptHookVDotNet2.2.10.13'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $package
          Copy-Item -LiteralPath $package -Destination $packageZip -Force
          Expand-Archive -LiteralPath $packageZip -DestinationPath $extract -Force
          $refs = @(Get-ChildItem -LiteralPath $extract -Filter 'ScriptHookVDotNet2.dll' -File -Recurse)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'Pinned ScriptHookVDotNet2 reference is missing or invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Restored ScriptHookVDotNet2 2.10.13 reference ($($refs[0].Length) bytes)."

      - name: Compile 1.3.9 C# trainer and package installer
        shell: pwsh
        run: |
          Push-Location $env:AVERNE_PROJECT_ROOT
          try {
            & cmd.exe /d /c 'BUILD_RELEASE.bat "" --no-pause'
            $buildExit = $LASTEXITCODE
            if ($buildExit -ne 0) {
              foreach ($log in @('AvernesSowtware_Build.log','BUILD_RELEASE.log')) {
                if (Test-Path -LiteralPath $log) { Write-Host "===== $log ====="; Get-Content -LiteralPath $log -Raw | Write-Host }
              }
              throw "1.3.9 build failed with exit code $buildExit."
            }
            $compilerLog = Join-Path $env:AVERNE_PROJECT_ROOT 'AvernesSowtware_Build.log'
            if ((Test-Path -LiteralPath $compilerLog) -and ((Get-Content -LiteralPath $compilerLog -Raw) -match 'warning CS\d+')) {
              throw "C# compiler warnings remain after release cleanup. See $compilerLog."
            }
            $dll = Join-Path $env:AVERNE_PROJECT_ROOT 'dist\AvernesSowtware.dll'
            $zip = Join-Path $env:AVERNE_PROJECT_ROOT 'dist\AvernesSowtware_v1.3.9_RELEASE.zip'
            if (-not (Test-Path -LiteralPath $dll) -or (Get-Item -LiteralPath $dll).Length -le 0) { throw 'Compiled 1.3.9 DLL is missing or empty.' }
            if (-not (Test-Path -LiteralPath $zip) -or (Get-Item -LiteralPath $zip).Length -le 0) { throw '1.3.9 release ZIP is missing or empty.' }
            Write-Host "DLL SHA-256: $((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash)"
            Write-Host "ZIP SHA-256: $((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash)"
          } finally { Pop-Location }

      - name: Test installer migration and repeated-install preservation
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:AVERNE_PROJECT_ROOT 'build\Test-InstallerIdempotence.ps1') -ProjectRoot $env:AVERNE_PROJECT_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Installer migration/idempotence test failed.' }

      - name: Validate release ZIP contents and extraction
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:AVERNE_PROJECT_ROOT 'dist\AvernesSowtware_v1.3.9_RELEASE.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries)
            $names = @($entries | ForEach-Object { $_.FullName.Replace([char]92, '/') })
            if ($entries.Count -lt 20) { throw "Release ZIP has unexpectedly few entries: $($entries.Count)." }
            if ($names[0] -ne 'AvernesSowtware_v1.3.9/Install_AvernesSowtware.bat') { throw 'Installer is not first in release ZIP.' }
            $dlls = @($names | Where-Object { $_ -match '\.dll$' })
            if ($dlls.Count -ne 1 -or $dlls[0] -ne 'AvernesSowtware_v1.3.9/dist/AvernesSowtware.dll') { throw 'Release ZIP must contain exactly one trainer DLL.' }
            if (@($names | Where-Object { $_ -match '/(tests|\.github)/' }).Count -gt 0) { throw 'Development tests or GitHub workflow files were included in the installer ZIP.' }
            if (@($names | Where-Object { $_ -match '(__pycache__/|\.py[co]$)' }).Count -gt 0) { throw 'Python cache files were included in the installer ZIP.' }
            foreach ($required in @('vehicle_catalog.json','Vehicles/vehicles.json','addons.json','hotkeys.json','docs/TEST_REPORT_1_3_9_RU.md')) {
              if (@($names | Where-Object { $_ -like "*/$required" }).Count -eq 0) { throw "Missing release file: $required" }
            }
          } finally { $zip.Dispose() }
          $verifyDir = Join-Path $env:RUNNER_TEMP 'averne-139-zip-check'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force
          $releaseRoot = Join-Path $verifyDir 'AvernesSowtware_v1.3.9'
          if (-not (Test-Path (Join-Path $releaseRoot 'Install_AvernesSowtware.bat'))) { throw 'Installer missing after ZIP extraction.' }
          if (-not (Test-Path (Join-Path $releaseRoot 'dist\AvernesSowtware.dll'))) { throw 'DLL missing after ZIP extraction.' }
          $catalog = Get-Content -Raw (Join-Path $releaseRoot 'package\AvernesSowtware\vehicle_catalog.json') | ConvertFrom-Json
          $vehicleCatalog = Get-Content -Raw (Join-Path $releaseRoot 'package\AvernesSowtware\Vehicles\vehicles.json') | ConvertFrom-Json
          $addons = Get-Content -Raw (Join-Path $releaseRoot 'package\AvernesSowtware\addons.json') | ConvertFrom-Json
          if (@($catalog).Count -ne 480 -or @($vehicleCatalog).Count -ne 480 -or @($addons).Count -ne 85) { throw 'Vehicle database counts do not match expected 1.3.9 baseline.' }
          Write-Host "Release ZIP valid and extractable: $($entries.Count) entries; catalog 480/480; addons 85."

      - name: Stage release artifact and build logs
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-artifact'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:AVERNE_PROJECT_ROOT 'dist\AvernesSowtware_v1.3.9_RELEASE.zip') -Destination $out -Force
          foreach ($name in @('BUILD_RELEASE_REPORT_RU.txt','BUILD_RELEASE.log','AvernesSowtware_Build.log')) {
            $source = Join-Path $env:AVERNE_PROJECT_ROOT $name
            if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination $out -Force }
          }
          Get-FileHash -LiteralPath (Join-Path $out 'AvernesSowtware_v1.3.9_RELEASE.zip') -Algorithm SHA256 | Format-List | Out-String | Set-Content -LiteralPath (Join-Path $out 'SHA256.txt')

      - name: Upload full 1.3.9 release package
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.3.9-RELEASE
          path: release-artifact/*
          if-no-files-found: error
          retention-days: 14
