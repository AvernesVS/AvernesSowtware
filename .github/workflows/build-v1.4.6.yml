name: Build AvernesSowtware v1.4.6

on:
  push:
    branches:
      - release/v1.4.6-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@v4

      - name: Download verified v1.4.5 source baseline
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.4.5-RELEASE
          path: ${{ runner.temp }}/base145
          repository: ${{ github.repository }}
          run-id: 44237043485
          github-token: ${{ github.token }}

      - name: Prepare source and apply v1.4.6 changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseZip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'base145') -Filter 'AvernesSowtware_v1.4.5_RELEASE.zip' -Recurse | Select-Object -First 1
          if (-not $releaseZip) { throw 'Verified v1.4.5 release artifact is missing.' }
          $extract = Join-Path $env:RUNNER_TEMP 'src145'
          Expand-Archive -LiteralPath $releaseZip.FullName -DestinationPath $extract -Force
          $sourceRoot = Join-Path $extract 'AvernesSowtware_v1.4.5'
          if (-not (Test-Path (Join-Path $sourceRoot 'src/Core/AvernesSowtwareScript.cs'))) { throw 'Verified baseline source tree is incomplete.' }
          git -C $sourceRoot init -q
          $patchRepo = Join-Path $env:RUNNER_TEMP 'v146patch'
          git clone --depth 1 --branch work/1.4.6-runtime-fixes https://github.com/AvernesVS/AvernesSowtware.git $patchRepo
          @'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'v146patch', '.github', 'build-input')
          import itertools
          parts = [(root / ('patches_1_4_6.part%02d' % i)).read_text(encoding='ascii').strip() for i in range(1, 7)]
          print('Segment stats:', [(len(x), x[:12], x[-12:], x.count('=')) for x in parts])
          decoded_parts = [base64.b64decode(x) for x in parts]
          packed = patch = None
          for order in itertools.permutations(range(6)):
              candidate = b''.join(decoded_parts[i] for i in order)
              try:
                  decoded = gzip.decompress(candidate)
                  packed, patch = candidate, decoded
                  print('Valid decoded-byte segment order:', order)
                  break
              except (OSError, EOFError):
                  pass
          if patch is None:
              raise SystemExit('No ordering of the six decoded v1.4.6 patch segments produced a valid gzip archive.')
          out = Path(os.environ['RUNNER_TEMP'], 'v1.4.6-source.patch')
          out.write_bytes(patch)
          print('v1.4.6 patch archive SHA256:', hashlib.sha256(packed).hexdigest())
          print('v1.4.6 patch SHA256:', hashlib.sha256(patch).hexdigest())
          print('Patch header:', patch[:1200].decode('utf-8', errors='replace'))
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'decode146.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'decode146.py')
          if ($LASTEXITCODE -ne 0) { throw 'Could not reconstruct v1.4.6 patch segments.' }
          git -C $sourceRoot apply --check --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v1.4.6-source.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Verified v1.4.6 patch does not apply to the v1.4.5 baseline.' }
          git -C $sourceRoot apply --whitespace=nowarn (Join-Path $env:RUNNER_TEMP 'v1.4.6-source.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply reconstructed v1.4.6 patch.' }
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Prepared source root: $sourceRoot"

      - name: Restore ScriptHookVDotNet2 API 2 reference
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'shvdn.nupkg'
          $out = Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $pkg
          $zip = Join-Path $env:RUNNER_TEMP 'shvdn.zip'
          Copy-Item $pkg $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $refs = @(Get-ChildItem $out -Filter ScriptHookVDotNet2.dll -Recurse -File)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'ScriptHookVDotNet2 API 2 reference is invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run v1.4.6 regression tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location $env:SOURCE_ROOT
          python -m pytest -q
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'v1.4.6 regression tests failed.' }

      - name: Build and package v1.4.6
        shell: cmd
        run: |
          cd /d "%SOURCE_ROOT%"
          call BUILD_RELEASE.bat
          if errorlevel 1 exit /b 1
          if not exist "dist\AvernesSowtware_v1.4.6_RELEASE.zip" exit /b 1

      - name: Upload release ZIP and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.4.6-Windows-Release
          path: |
            ${{ env.SOURCE_ROOT }}/dist/AvernesSowtware_v1.4.6_RELEASE.zip
            ${{ env.SOURCE_ROOT }}/BUILD_RELEASE_REPORT_RU.txt
            ${{ env.SOURCE_ROOT }}/BUILD_RELEASE.log
            ${{ env.SOURCE_ROOT }}/AvernesSowtware_Build.log
          if-no-files-found: error
          retention-days: 30
