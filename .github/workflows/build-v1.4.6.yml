name: Build AvernesSowtware v1.4.6

on:
  push:
    branches:
      - release/v1.4.6-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@v4

      - name: Download verified v1.4.5 source baseline
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.4.5-RELEASE
          path: ${{ runner.temp }}/base145
          repository: ${{ github.repository }}
          run-id: 44258388736
          github-token: ${{ github.token }}

      - name: Prepare source and apply v1.4.6 changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseZip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'base145') -Filter 'AvernesSowtware_v1.4.5_RELEASE.zip' -Recurse | Select-Object -First 1
          if (-not $releaseZip) { throw 'Verified v1.4.5 release artifact is missing.' }
          $extract = Join-Path $env:RUNNER_TEMP 'src145'
          Expand-Archive -LiteralPath $releaseZip.FullName -DestinationPath $extract -Force
          $sourceRoot = Join-Path $extract 'AvernesSowtware_v1.4.5'
          if (-not (Test-Path (Join-Path $sourceRoot 'src/Core/AvernesSowtwareScript.cs'))) { throw 'Verified baseline source tree is incomplete.' }
          git -C $sourceRoot init -q
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'build-input/AvernesSowtware_v1.4.6_working.patch') (Join-Path $sourceRoot 'v1.4.6.patch')
          git -C $sourceRoot apply --recount --check --whitespace=nowarn (Join-Path $sourceRoot 'v1.4.6.patch')
          if ($LASTEXITCODE -ne 0) { throw 'v1.4.6 working patch does not apply to the latest hardened v1.4.5 baseline.' }
          git -C $sourceRoot apply --recount --whitespace=nowarn (Join-Path $sourceRoot 'v1.4.6.patch')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply v1.4.6 working patch.' }
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Prepared source root: $sourceRoot"

      - name: Restore ScriptHookVDotNet2 API 2 reference
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'shvdn.nupkg'
          $out = Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $pkg
          $zip = Join-Path $env:RUNNER_TEMP 'shvdn.zip'
          Copy-Item $pkg $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $refs = @(Get-ChildItem $out -Filter ScriptHookVDotNet2.dll -Recurse -File)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'ScriptHookVDotNet2 API 2 reference is invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run v1.4.6 regression tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          python -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pytest for the regression suite.' }
          Push-Location $env:SOURCE_ROOT
          python -m pytest -q
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'v1.4.6 regression tests failed.' }

      - name: Build and package v1.4.6
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try {
            & cmd.exe /d /c 'BUILD_RELEASE.bat "" --no-pause'
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              foreach ($f in @('AvernesSowtware_Build.log','BUILD_RELEASE.log','BUILD_RELEASE_REPORT_RU.txt')) {
                if (Test-Path $f) { Write-Host "===== $f ====="; Get-Content $f -Raw | Write-Host }
              }
              throw "Windows C# build failed with exit code $code."
            }
            if (-not (Test-Path 'dist\AvernesSowtware_v1.4.6_RELEASE.zip')) {
              foreach ($f in @('AvernesSowtware_Build.log','BUILD_RELEASE.log','BUILD_RELEASE_REPORT_RU.txt')) {
                if (Test-Path $f) { Write-Host "===== $f ====="; Get-Content $f -Raw | Write-Host }
              }
              throw 'Expected v1.4.6 release ZIP was not produced.'
            }
          } finally { Pop-Location }

      - name: Upload release ZIP and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.4.6-Windows-Release
          path: |
            ${{ env.SOURCE_ROOT }}/dist/AvernesSowtware_v1.4.6_RELEASE.zip
            ${{ env.SOURCE_ROOT }}/BUILD_RELEASE_REPORT_RU.txt
            ${{ env.SOURCE_ROOT }}/BUILD_RELEASE.log
            ${{ env.SOURCE_ROOT }}/AvernesSowtware_Build.log
          if-no-files-found: warn
          retention-days: 30
