      - name: Get ScriptHookVDotNet2 reference assembly
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "shvdn2.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP "shvdn2.zip"
          $dest = Join-Path $env:RUNNER_TEMP "shvdn2"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13" -OutFile $pkg
          Copy-Item $pkg $zip -Force
          Expand-Archive $zip $dest -Force
          $dll = Get-ChildItem $dest -Recurse -Filter "ScriptHookVDotNet2.dll" | Select-Object -First 1
          if (-not $dll) { throw "ScriptHookVDotNet2.dll was not found in the reference package." }
          "YNIX_SHVDN_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AVERNE_SHVDN_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8


      - name: Apply incremental 1.3.8 Nitro scaling patch and run current regression suites
        shell: pwsh
        run: |
          $root = $env:AVERNE_PROJECT_ROOT
          $env:PATCH_PATH = Join-Path $env:RUNNER_TEMP "patches_1_3_8.patch"
          @'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path(".github/build-input/patches_1_3_8.patch.gz.b64").read_text(encoding="ascii").strip()
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != "1a795b5a7bd2ca88b5ee3b3280521e174a4a43ad0b40e91010f3e8dcfd3b8d81":
              raise SystemExit("Compressed 1.3.8 patch SHA-256 mismatch")
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != "2ff8a6beb6959806e841a926c8a6bfa5d12663014a57968986e422a00c174c7d":
              raise SystemExit("Expanded 1.3.8 patch SHA-256 mismatch")
          Path(os.environ["PATCH_PATH"]).write_bytes(patch)
          print("Verified incremental 1.3.8 patch:", len(patch), "bytes")
          '@ | Set-Content -Path (Join-Path $env:RUNNER_TEMP "prepare_1_3_8.py") -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP "prepare_1_3_8.py")
          if ($LASTEXITCODE -ne 0) { throw "1.3.8 patch reconstruction or checksum validation failed." }

          Push-Location $root
          try {
            git apply --ignore-whitespace --exclude=BUILD_RELEASE_REPORT_RU.txt --check $env:PATCH_PATH
            if ($LASTEXITCODE -ne 0) { throw "1.3.8 patch does not apply cleanly to the 1.3.7 source." }
            git apply --ignore-whitespace --exclude=BUILD_RELEASE_REPORT_RU.txt $env:PATCH_PATH
            if ($LASTEXITCODE -ne 0) { throw "Applying incremental 1.3.8 patch failed." }
            python -m unittest tests/test_1_3_7_regressions.py tests/test_1_3_8_regressions.py -v
            if ($LASTEXITCODE -ne 0) { throw "Current 1.3.7/1.3.8 regression suites failed." }
          } finally { Pop-Location }

          $main = Join-Path $root "src\Core\AvernesSowtwareScript.cs"
          if (-not (Select-String -Path $main -Pattern 'ProductVersion = "1.3.8"' -Quiet)) { throw "Product version is not 1.3.8." }
          Write-Host "Incremental 1.3.8 patch applied; current 1.3.7/1.3.8 regression suites passed."
      - name: Compile 1.3.8, run validators, package and test installer
        shell: pwsh
        run: |
          $root = $env:AVERNE_PROJECT_ROOT
          $builder = Join-Path $root "BUILD_RELEASE.bat"
          & $builder "" "--no-pause"
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $compilerLog = Join-Path $root "AvernesSowtware_Build.log"
            $releaseLog = Join-Path $root "BUILD_RELEASE.log"
            if (Test-Path $compilerLog) { Write-Host "===== C# COMPILER DIAGNOSTICS ====="; Get-Content $compilerLog -Raw | Write-Host }
            if (Test-Path $releaseLog) { Write-Host "===== RELEASE BUILD DIAGNOSTICS ====="; Get-Content $releaseLog -Raw | Write-Host }
            throw "1.3.8 build failed with exit code $buildExit. See diagnostics above."
          }

          $installerTest = Join-Path $root "build\Test-InstallerIdempotence.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installerTest -ProjectRoot $root
          $installerTestExit = $LASTEXITCODE
          if ($installerTestExit -ne 0) {
            Write-Host "===== INSTALLER LOG AFTER REGRESSION FAILURE ====="
            $installLog = Join-Path $root "AvernesSowtware_Install.log"
            if (Test-Path $installLog) { Get-Content $installLog -Raw | Write-Host }
            Write-Host "===== STORAGE FINALIZATION SCRIPT ====="
            $storageScript = Join-Path $root "build\Finalize-InstallStorage.ps1"
            if (Test-Path $storageScript) { Get-Content $storageScript -Raw | Write-Host }
            Write-Host "===== MIGRATION SCRIPT ====="
            $migrationScript = Join-Path $root "build\Migrate-LegacyData.ps1"
            if (Test-Path $migrationScript) { Get-Content $migrationScript -Raw | Write-Host }
            throw "Repeated-install regression test failed with exit code $installerTestExit."
          }

          $dll = Join-Path $root "dist\AvernesSowtware.dll"
          $zip = Join-Path $root "dist\AvernesSowtware_v1.3.8_RELEASE.zip"
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -le 0) { throw "Compiled AvernesSowtware.dll is missing or empty." }
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw "1.3.8 release ZIP is missing or empty." }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zr = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($zr.Entries)
            $names = @($entries | ForEach-Object { $_.FullName.Replace([char]92, '/') })
            if ($names.Count -eq 0 -or $names[0] -ne "AvernesSowtware_v1.3.8/Install_AvernesSowtware.bat") { throw "Installer is not the first archive entry." }
            $dllEntries = @($names | Where-Object { $_ -eq "AvernesSowtware_v1.3.8/dist/AvernesSowtware.dll" })
            if ($dllEntries.Count -ne 1) { throw "Expected exactly one release DLL; found $($dllEntries.Count)." }
            $roots = @($names | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
            if ($roots.Count -ne 1 -or $roots[0] -ne "AvernesSowtware_v1.3.8") { throw "Invalid release ZIP root: $($roots -join ', ')." }
            $mustHave = @("AvernesSowtware_v1.3.8/src/Core/AvernesSowtwareScript.cs", "AvernesSowtware_v1.3.8/src/Managers/VehicleSystems.cs", "AvernesSowtware_v1.3.8/src/UI/MenuRenderer.cs", "AvernesSowtware_v1.3.8/assets/AvernesSowtware.ico", "AvernesSowtware_v1.3.8/build/Test-InstallerIdempotence.ps1", "AvernesSowtware_v1.3.8/build/Migrate-LegacyData.ps1", "AvernesSowtware_v1.3.8/build/Finalize-InstallStorage.ps1", "AvernesSowtware_v1.3.8/docs/CHANGELOG_1_3_3_RU.md", "AvernesSowtware_v1.3.8/docs/TEST_REPORT_1_3_3_RU.md", "AvernesSowtware_v1.3.8/docs/CHANGELOG_1_3_5_RU.md", "AvernesSowtware_v1.3.8/docs/TEST_REPORT_1_3_5_RU.md", "AvernesSowtware_v1.3.8/docs/CHANGELOG_1_3_6_RU.md", "AvernesSowtware_v1.3.8/docs/TEST_REPORT_1_3_6_RU.md", "AvernesSowtware_v1.3.8/docs/CHANGELOG_1_3_7_RU.md", "AvernesSowtware_v1.3.8/docs/TEST_REPORT_1_3_7_RU.md", "AvernesSowtware_v1.3.8/docs/CHANGELOG_1_3_8_RU.md", "AvernesSowtware_v1.3.8/docs/TEST_REPORT_1_3_8_RU.md", "AvernesSowtware_v1.3.8/tests/test_1_3_8_regressions.py")
            foreach ($item in $mustHave) { if ($names -notcontains $item) { throw "Release ZIP is missing required file: $item" } }
            Write-Host "RELEASE ZIP VALID: entries=$($names.Count); installer-first; one DLL; new module paths and icon included."
          } finally { $zr.Dispose() }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-artifact"
          New-Item $artifactDir -ItemType Directory -Force | Out-Null
          Copy-Item $zip (Join-Path $artifactDir "AvernesSowtware_v1.3.8_RELEASE.zip") -Force

      - name: Upload AvernesSowtware 1.3.8 release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.3.8-RELEASE
          path: release-artifact/AvernesSowtware_v1.3.8_RELEASE.zip
          if-no-files-found: error
          retention-days: 14
