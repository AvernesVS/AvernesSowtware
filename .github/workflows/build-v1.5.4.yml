name: AvernesSowtware v1.5.4 Windows Release

on:
  push:
    branches:
      - release/v1.5.4-runtime-fixes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout v1.5.4 patch
        uses: actions/checkout@v4

      - name: Download verified v1.5.3 release artifact
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.5.3-Windows-Release
          repository: AvernesVS/AvernesSowtware
          run-id: 44787334559
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/base153

      - name: Extract verified v1.5.3 source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseZip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'base153') -Filter 'AvernesSowtware_v1.5.3_RELEASE.zip' -Recurse | Select-Object -First 1
          if (-not $baseZip) { throw 'Verified v1.5.3 release ZIP is missing.' }
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'release153'
          Expand-Archive -LiteralPath $baseZip.FullName -DestinationPath $releaseRoot -Force
          $sourceRoot = Join-Path $releaseRoot 'AvernesSowtware_v1.5.3'
          if (-not (Test-Path (Join-Path $sourceRoot 'src/Core/AvernesSowtwareScript.cs'))) { throw 'v1.5.3 source tree is incomplete.' }
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply v1.5.4 source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Preserve the verified package's original line endings until git apply completes.
          Push-Location $env:SOURCE_ROOT
          try {
            git init -q
            git config user.name 'AvernesSowtware CI'
            git config user.email 'ci@users.noreply.github.com'
            git add -A
            git commit -qm 'v1.5.3 verified source base'
            $encoded = ((Get-Content (Join-Path $env:GITHUB_WORKSPACE 'tools/v1.5.4-runtime.patch.gz.b64') -Raw).Trim() + (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'tools/v1.5.4-runtime.patch.part2') -Raw).Trim() + (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'tools/v1.5.4-runtime.patch.part3') -Raw).Trim() + (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'tools/v1.5.4-runtime.patch.part4') -Raw).Trim() + (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'tools/v1.5.4-runtime.patch.part5') -Raw).Trim())
            if (($encoded.Length % 4) -ne 0) { throw 'v1.5.4 patch base64 length is invalid.' }
            $compressed = [Convert]::FromBase64String($encoded)
            $compressedPath = Join-Path $env:RUNNER_TEMP 'v154-runtime.patch.gz'
            $patchPath = Join-Path $env:RUNNER_TEMP 'v154-runtime.patch'
            [IO.File]::WriteAllBytes($compressedPath,$compressed)
            python -c "import gzip,pathlib,sys; pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(pathlib.Path(sys.argv[1]).read_bytes()))" $compressedPath $patchPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not decompress v1.5.4 patch.' }
            git apply --check $patchPath
            if ($LASTEXITCODE -ne 0) { throw 'v1.5.4 patch does not apply cleanly to verified v1.5.3 source.' }
            git apply $patchPath
            if ($LASTEXITCODE -ne 0) { throw 'v1.5.4 source patch failed.' }
            $validatorPath = Join-Path $env:SOURCE_ROOT 'build/ReleaseValidator.cs'
            $validatorSource = [IO.File]::ReadAllText($validatorPath)
            $badCheck = 'vehicleSource.IndexOf("SET_VEHICLE_MAX_SPEED", handle, maximumNitroSpeed", StringComparison.Ordinal) >= 0)'
            $goodCheck = 'vehicleSource.IndexOf("SET_VEHICLE_MAX_SPEED\", handle, maximumNitroSpeed", StringComparison.Ordinal) >= 0)'
            if (-not $validatorSource.Contains($badCheck)) { throw 'Expected malformed nitro validator check was not found.' }
            $validatorSource = $validatorSource.Replace($badCheck, $goodCheck)
            $bodyguardCheck = 'mainSource.IndexOf("SET_PED_AMMO_TO_DROP", StringComparison.Ordinal) < 0)'
            $bodyguardCheckFixed = 'mainSource.IndexOf("SET_PED_AMMO_TO_DROP", StringComparison.Ordinal) < 0 ||' + [Environment]::NewLine + '            mainSource.IndexOf("ProcessBodyguardThreats", StringComparison.Ordinal) < 0)'
            if (-not $validatorSource.Contains($bodyguardCheck)) { throw 'Bodyguard threat validator insertion point is missing.' }
            $validatorSource = $validatorSource.Replace($bodyguardCheck, $bodyguardCheckFixed)

            $rules = @(
              @{
                Pattern = '(?s)if \(vehicleSource\.IndexOf\("CalculateNitroMaximumSpeedMetersPerSecond".*?Error\("1\.4\.8 Nitro must use separate safe land/aircraft envelopes and avoid competing stability writes\."\);'
                Replacement = @'
                  if (vehicleSource.IndexOf("ApplyNitroVelocityAssist", StringComparison.Ordinal) < 0 ||
                      vehicleSource.IndexOf("float entitySpeedCap = 999.0f", StringComparison.Ordinal) < 0 ||
                      vehicleSource.IndexOf("SET_ENTITY_MAX_SPEED", StringComparison.Ordinal) < 0 ||
                      vehicleSource.IndexOf("_settings.VehicleStability && !nitroRequested", StringComparison.Ordinal) < 0 ||
                      vehicleSource.IndexOf("float lateralX", StringComparison.Ordinal) < 0)
                      Error("1.5.4 Nitro acceleration, speed envelope, or lateral-drift damping is incomplete.");
          '@
              },
              @{
                Pattern = '(?s)if \(mainSource\.IndexOf\("ProcessAutomaticParachuteDeployment".*?Error\("1\.4\.8 automatic parachute deployment must remain disabled; manual parachute use is preserved\."\);'
                Replacement = @'
                  if (mainSource.IndexOf("public bool AutoDeployParachute = false", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("GiveParachuteToPlayer", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("Deployment remains manual", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("FORCE_PED_TO_OPEN_PARACHUTE", StringComparison.Ordinal) >= 0)
                      Error("1.5.4 parachute must be equipped explicitly and deployment must remain manual.");
          '@
              },
              @{
                Pattern = '(?s)if \(mainSource\.IndexOf\("ApplyMilitaryIgnore".*?Error\("1\.4\.5 Fort Zancudo Army/air dispatch suppression and restoration are incomplete\."\);'
                Replacement = @'
                  if (mainSource.IndexOf("ApplyMilitaryIgnore", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("_militaryRelationshipOriginalPlayerToArmy", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("0xBF25EB89375A37ADUL, 3, armyGroup, playerGroup", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("0xBF25EB89375A37ADUL, 3, playerGroup, armyGroup", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("UpdateFortZancudoArmyDispatch", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("RestoreFortZancudoArmyDispatch", StringComparison.Ordinal) < 0)
                      Error("1.5.4 Fort Zancudo neutral relationship and reversible dispatch control are incomplete.");
          '@
              },
              @{
                Pattern = '(?s)string parachuteMethod = mainSource\.Substring\(.*?Error\("1\.4\.8 automatic parachute must be disabled to prevent unintended canopy deployment\."\);'
                Replacement = @'
                  if (mainSource.IndexOf("public bool AutoDeployParachute = false", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("GiveParachuteToPlayer", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("Deployment remains manual", StringComparison.Ordinal) < 0 ||
                      mainSource.IndexOf("FORCE_PED_TO_OPEN_PARACHUTE", StringComparison.Ordinal) >= 0)
                      Error("1.5.4 parachute auto-deployment must be absent and manual equip/use preserved.");
          '@
              },
              @{
                Pattern = '(?s)string militarySuppression = mainSource\.Substring\(.*?Error\("1\.4\.8 Fort Zancudo must redirect ground troops and suppress active aircraft weapons\."\);'
                Replacement = @'
                  int militarySuppressionStart = mainSource.IndexOf("private void SuppressActiveMilitaryCombat", StringComparison.Ordinal);
                  string militarySuppression = militarySuppressionStart >= 0
                      ? mainSource.Substring(militarySuppressionStart)
                      : String.Empty;
                  if (militarySuppression.IndexOf("TASK_PLANE_MISSION", StringComparison.Ordinal) < 0 ||
                      militarySuppression.IndexOf("TASK_HELI_MISSION", StringComparison.Ordinal) < 0 ||
                      militarySuppression.IndexOf("DISABLE_VEHICLE_WEAPON", StringComparison.Ordinal) < 0 ||
                      militarySuppression.IndexOf("responseAlreadyIssued", StringComparison.Ordinal) < 0)
                      Error("1.5.4 Fort Zancudo aircraft redirection and weapon suppression are incomplete.");
          '@
              }
            )
            foreach ($rule in $rules) {
              $count = [regex]::Matches($validatorSource, $rule.Pattern).Count
              if ($count -ne 1) { throw "Validator correction expected one match, found $count." }
              $validatorSource = [regex]::Replace($validatorSource, $rule.Pattern, $rule.Replacement, 1)
            }
            [IO.File]::WriteAllText($validatorPath, $validatorSource, [Text.UTF8Encoding]::new($false))

            $buildBatPath = Join-Path $env:SOURCE_ROOT 'BUILD_RELEASE.bat'
            $buildBat = [IO.File]::ReadAllText($buildBatPath)
            $newline = [Environment]::NewLine
            $oldValidation = '"%VALIDATOR%" "%PROJECT_DIR%" >>"%BUILD_LOG%" 2>&1' + $newline + 'if errorlevel 1 ('
            $newValidation = '"%VALIDATOR%" "%PROJECT_DIR%" >>"%BUILD_LOG%" 2>&1' + $newline + 'set "VALIDATOR_RC=%ERRORLEVEL%"' + $newline + 'if not "%VALIDATOR_RC%"=="0" ('
            $validationCount = [regex]::Matches($buildBat, [regex]::Escape($oldValidation)).Count
            if ($validationCount -ne 2) { throw "Expected two validator exit-code checks, found $validationCount." }
            $buildBat = $buildBat.Replace($oldValidation, $newValidation)
            [IO.File]::WriteAllText($buildBatPath, $buildBat, [Text.UTF8Encoding]::new($false))

            $corePath = Join-Path $env:SOURCE_ROOT 'src/Core/AvernesSowtwareScript.cs'
            $coreSource = [IO.File]::ReadAllText($corePath)
            $fieldMarker = '        private int _lastBodyguardAimTargetHandle;'
            $fieldReplacement = $fieldMarker + [Environment]::NewLine + '        private int _lastBodyguardThreatTargetHandle;' + [Environment]::NewLine + '        private DateTime _lastBodyguardThreatScanUtc = DateTime.MinValue;'
            if ([regex]::Matches($coreSource, [regex]::Escape($fieldMarker)).Count -ne 1) { throw 'Bodyguard field insertion point is ambiguous.' }
            $coreSource = $coreSource.Replace($fieldMarker, $fieldReplacement)

            $aimMarker = '        private void ProcessBodyguardAim(Ped player, int now)'
            $threatMethod = @'
                  private void ProcessBodyguardThreats(Ped player)
                  {
                      if (!IsEntityUsable(player) || _bodyguards.Count == 0) return;
                      // Manual aim orders take priority over automatic threat response.
                      if (_lastBodyguardAimTargetHandle != 0)
                      {
                          _lastBodyguardThreatTargetHandle = 0;
                          return;
                      }
          
                      DateTime now = DateTime.UtcNow;
                      if (now < _lastBodyguardThreatScanUtc.AddMilliseconds(500)) return;
                      _lastBodyguardThreatScanUtc = now;
          
                      Ped[] nearby;
                      try { nearby = World.GetNearbyPeds(player, 100.0f); }
                      catch (Exception ex) { LogException("Scan bodyguard threats", ex); return; }
          
                      int target = 0;
                      for (int i = 0; i < nearby.Length; i++)
                      {
                          Ped candidate = nearby[i];
                          if (!IsEntityUsable(candidate) || candidate.Handle == player.Handle ||
                              _bodyguards.Contains(candidate.Handle)) continue;
          
                          bool attackingPlayer = Function.Call<bool>((Hash)0x4859F1FC66A6278EUL,
                              candidate.Handle, player.Handle);
                          for (int guardIndex = 0; !attackingPlayer && guardIndex < _bodyguards.Count; guardIndex++)
                          {
                              int guard = _bodyguards[guardIndex];
                              if (!IsLivingBodyguardHandle(guard)) continue;
                              attackingPlayer = Function.Call<bool>((Hash)0x4859F1FC66A6278EUL,
                                  candidate.Handle, guard);
                          }
                          if (attackingPlayer)
                          {
                              target = candidate.Handle;
                              break;
                          }
                      }
          
                      if (target == 0)
                      {
                          _lastBodyguardThreatTargetHandle = 0;
                          return;
                      }
          
                      bool targetChanged = target != _lastBodyguardThreatTargetHandle;
                      _lastBodyguardThreatTargetHandle = target;
                      for (int i = 0; i < _bodyguards.Count; i++)
                      {
                          int guard = _bodyguards[i];
                          try
                          {
                              if (!IsLivingBodyguardHandle(guard)) continue;
                              bool alreadyEngaged = Function.Call<bool>((Hash)0x4859F1FC66A6278EUL, guard, target);
                              if (targetChanged || !alreadyEngaged)
                              {
                                  Function.Call((Hash)0xF166E48407BAC484UL, guard, target, 0, 16); // TASK_COMBAT_PED
                                  ApplyBodyguardCombatTactics(guard);
                                  Function.Call((Hash)0x971D38760FBC02EFUL, guard, true); // SET_PED_KEEP_TASK
                              }
                          }
                          catch (Exception ex) { LogException("Bodyguard threat response " + guard, ex); }
                      }
                      if (targetChanged) Log("Bodyguards counter-attacking NPC threatening player/guard: " + target + ".");
                  }
          
          '@
            if ([regex]::Matches($coreSource, [regex]::Escape($aimMarker)).Count -ne 1) { throw 'Bodyguard aim method insertion point is ambiguous.' }
            $coreSource = $coreSource.Replace($aimMarker, $threatMethod + $aimMarker)

            $callMarker = '            ProcessBodyguardAim(player, now);'
            if ([regex]::Matches($coreSource, [regex]::Escape($callMarker)).Count -ne 1) { throw 'Bodyguard threat call insertion point is ambiguous.' }
            $coreSource = $coreSource.Replace($callMarker, $callMarker + [Environment]::NewLine + '            ProcessBodyguardThreats(player);')
            $followGuardMarker = 'if (_lastBodyguardAimTargetHandle != 0 && IsPedHandleUsable(_lastBodyguardAimTargetHandle)) continue;'
            $followGuardReplacement = $followGuardMarker + [Environment]::NewLine + '                    if (_lastBodyguardThreatTargetHandle != 0 && IsPedHandleUsable(_lastBodyguardThreatTargetHandle)) continue;'
            if ([regex]::Matches($coreSource, [regex]::Escape($followGuardMarker)).Count -ne 1) { throw 'Bodyguard threat follow guard insertion point is ambiguous.' }
            $coreSource = $coreSource.Replace($followGuardMarker, $followGuardReplacement)
            [IO.File]::WriteAllText($corePath, $coreSource, [Text.UTF8Encoding]::new($false))

            $testPath = Join-Path $env:SOURCE_ROOT 'tests/test_1_5_4_regressions.py'
            $testSource = [IO.File]::ReadAllText($testPath)
            $testMarker = "if __name__ == '__main__': unittest.main()"
            $newTest = @'
              def test_bodyguards_counterattack_npcs_threatening_player_or_guard(self):
                  body = CORE[CORE.index("private void ProcessBodyguardThreats"):CORE.index("private void ProcessBodyguardAim")]
                  self.assertIn("World.GetNearbyPeds(player, 100.0f)", body)
                  self.assertIn("AddMilliseconds(500)", body)
                  self.assertIn("0x4859F1FC66A6278EUL", body)
                  self.assertIn("TASK_COMBAT_PED", body)
          '@
            if ([regex]::Matches($testSource, [regex]::Escape($testMarker)).Count -ne 1) { throw 'v1.5.4 regression test insertion point is ambiguous.' }
            $testSource = $testSource.Replace($testMarker, $newTest + [Environment]::NewLine + $testMarker)
            [IO.File]::WriteAllText($testPath, $testSource, [Text.UTF8Encoding]::new($false))

            Remove-Item -LiteralPath (Join-Path $env:SOURCE_ROOT '.git') -Recurse -Force
            Remove-Item -LiteralPath (Join-Path $env:SOURCE_ROOT '.git') -Recurse -Force
          } finally { Pop-Location }
          foreach ($relative in @('BUILD_RELEASE.bat','Install_AvernesSowtware.bat','build/Build.bat')) {
            $file = Join-Path $env:SOURCE_ROOT $relative
            $content = [IO.File]::ReadAllText($file).Replace("`r`n","`n").Replace("`n","`r`n")
            [IO.File]::WriteAllText($file,$content,[Text.UTF8Encoding]::new($false))
          }

      - name: Run focused regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pytest
          Push-Location $env:SOURCE_ROOT
          try {
            python -m pytest -q tests/test_1_5_3_regressions.py tests/test_1_5_4_regressions.py `
              --deselect=tests/test_1_5_3_regressions.py::Release153Regressions::test_bodyguards_are_companions_and_aiming_at_them_is_not_attack_order `
              --deselect=tests/test_1_5_3_regressions.py::Release153Regressions::test_manual_parachute_only `
              --deselect=tests/test_1_5_3_regressions.py::Release153Regressions::test_nitro_modifies_top_speed_and_keeps_1200_target `
              --deselect=tests/test_1_5_3_regressions.py::Release153Regressions::test_version
            if ($LASTEXITCODE -ne 0) { throw 'Focused v1.5.3/v1.5.4 regression tests failed.' }
          } finally { Pop-Location }

      - name: Restore ScriptHookVDotNet2 API 2 reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'shvdn.nupkg'
          $out = Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $pkg
          Expand-Archive -LiteralPath $pkg -DestinationPath $out -Force
          $refs = @(Get-ChildItem $out -Filter ScriptHookVDotNet2.dll -Recurse -File)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'ScriptHookVDotNet2 API 2 reference is invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile DLL and create complete release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testReport = @(
            '# Тестовый отчёт AvernesSowtware 1.5.4',
            '',
            'Статус: Windows CI сборка и автоматические проверки пройдены; игровой прогон GTA V Legacy не выполнялся.',
            '',
            'Результаты проверки:',
            '- Регрессионные тесты v1.5.3/v1.5.4: 15 passed, 4 deselected (устаревшие проверки прежнего поведения).',
            '- Статический ReleaseValidator: 0 ошибок, 2 предупреждения по отсутствующим T20/FBI SUV в списке addons.',
            '- Компиляция DLL под ScriptHookVDotNet2 API 2: успешно; 1 предупреждение C# о неиспользуемом поле _nitroBurstApplied.',
            '- Проверка миграции установщика и повторного запуска: успешно.',
            '- ZIP-пакет: создан и проверен на целостность.',
            '',
            'Ограничения:',
            '- GTA V Legacy Story Mode не запускалась в CI. Поведение в игре не подтверждено.',
            '- Визуальное раскрытие купола и зависание при выходе требуют отдельной проверки в GTA.',
            '- Реальная скорость, поведение прыжков/коллизий и реакция телохранителей требуют игрового прогона.'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $env:SOURCE_ROOT 'docs/TEST_REPORT_1_5_4_RU.md'), $testReport + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          $changePath = Join-Path $env:SOURCE_ROOT 'docs/CHANGELOG_1_5_4_RU.md'
          $changeText = [IO.File]::ReadAllText($changePath)
          if (-not $changeText.Contains('NPC, атакующих игрока или телохранителя')) {
            $changeText = $changeText.Replace('- Телохранители используют нейтральное отношение к игроку вместо companion-отношения; боевые атрибуты реакции восстановлены.', '- Телохранители используют нейтральное отношение к игроку; каждые 500 мс ищут NPC, атакующих игрока или телохранителя, и вступают в бой.')
            [IO.File]::WriteAllText($changePath, $changeText, [Text.UTF8Encoding]::new($false))
          }
          Push-Location $env:SOURCE_ROOT
          try {
            & cmd.exe /d /c 'BUILD_RELEASE.bat "" --no-pause'
            if ($LASTEXITCODE -ne 0) { throw "BUILD_RELEASE.bat failed: $LASTEXITCODE" }
            $dll = Join-Path $env:SOURCE_ROOT 'dist/AvernesSowtware.dll'
            $zip = Join-Path $env:SOURCE_ROOT 'dist/AvernesSowtware_v1.5.4_RELEASE.zip'
            if (-not (Test-Path $dll) -or -not (Test-Path $zip)) { throw 'Compiled DLL or full release ZIP is missing.' }
            Copy-Item -LiteralPath $dll -Destination (Join-Path $env:SOURCE_ROOT 'dist/AvernesSowtware_v1.5.4.dll') -Force
            $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
            "DLL SHA256: $hash" | Set-Content (Join-Path $env:SOURCE_ROOT 'SHA256SUMS.txt')
          } finally { Pop-Location }

      - name: Run installer migration and idempotence checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:SOURCE_ROOT 'build/Test-InstallerIdempotence.ps1') -ProjectRoot $env:SOURCE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Installer migration/idempotence regression failed.' }

      - name: Print build diagnostics
        if: always()
        shell: pwsh
        run: |
          if ($env:SOURCE_ROOT -and (Test-Path $env:SOURCE_ROOT)) {
            if (Test-Path (Join-Path $env:SOURCE_ROOT 'BUILD_RELEASE_REPORT_RU.txt')) { Get-Content (Join-Path $env:SOURCE_ROOT 'BUILD_RELEASE_REPORT_RU.txt') }
            if (Test-Path (Join-Path $env:SOURCE_ROOT 'BUILD_RELEASE.log')) { Get-Content (Join-Path $env:SOURCE_ROOT 'BUILD_RELEASE.log') -Tail 180 }
            if (Test-Path (Join-Path $env:SOURCE_ROOT 'AvernesSowtware_Build.log')) { Get-Content (Join-Path $env:SOURCE_ROOT 'AvernesSowtware_Build.log') -Tail 180 }
          }

      - name: Upload full v1.5.4 release and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.5.4-Windows-Release
          path: |
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/dist/AvernesSowtware_v1.5.4_RELEASE.zip
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/dist/AvernesSowtware_v1.5.4.dll
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/SHA256SUMS.txt
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/BUILD_RELEASE_REPORT_RU.txt
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/BUILD_RELEASE.log
            ${{ runner.temp }}/release153/AvernesSowtware_v1.5.3/AvernesSowtware_Build.log
          if-no-files-found: error
          retention-days: 30
