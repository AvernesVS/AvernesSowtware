            git apply --ignore-whitespace --check $env:HOTFIX_PATH
            if ($LASTEXITCODE -ne 0) { throw "1.3.6 hotfix does not apply cleanly." }
            git apply --ignore-whitespace $env:HOTFIX_PATH
            if ($LASTEXITCODE -ne 0) { throw "Applying 1.3.6 hotfix failed." }
            python -m unittest tests/test_1_3_6_regressions.py -v
            if ($LASTEXITCODE -ne 0) { throw "1.3.6 regression tests failed." }
          } finally { Pop-Location }

          $main = Join-Path $root "src\Core\AvernesSowtwareScript.cs"
          if (-not (Select-String -Path $main -Pattern 'ProductVersion = "1.3.6"' -Quiet)) { throw "Product version is not 1.3.6." }
          Write-Host "Incremental 1.3.6 patch and 8 regression tests passed."

