name: Build AvernesTreiner v0.9.1 (.NET Framework 4.8)
on:
  pull_request:
    paths: ['src/**', 'resources/**', 'installer/**', 'README.md', 'LICENSE-ORIGINAL-MIT.txt', '.github/workflows/build-avernes-treiner.yml']
  push:
    branches: [main]
    paths: ['src/**', 'resources/**', 'installer/**', 'README.md', 'LICENSE-ORIGINAL-MIT.txt', '.github/workflows/build-avernes-treiner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $env:RUNNER_TEMP 'avernes-packages'
          New-Item -ItemType Directory -Path $packages -Force | Out-Null
          nuget install ScriptHookVDotNet2 -Version 2.10.13 -OutputDirectory $packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'ScriptHookVDotNet2 restore failed.' }
          nuget install NativeUI -Version 1.9.0 -DependencyVersion Ignore -OutputDirectory $packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NativeUI restore failed.' }
          $shvdn = Get-ChildItem $packages -Filter ScriptHookVDotNet2.dll -Recurse -File | Select-Object -First 1
          $native = Get-ChildItem $packages -Filter NativeUI.dll -Recurse -File | Select-Object -First 1
          if (-not $shvdn -or -not $native) { throw 'Dependency DLLs were not found.' }
          "SHVDN2_DLL=$($shvdn.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NATIVEUI_DLL=$($native.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile against .NET Framework 4.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD
          $src = Join-Path $root 'src'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $ref = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          if (-not (Test-Path (Join-Path $ref 'mscorlib.dll'))) { throw ".NET Framework 4.8 reference assemblies not found." }
          $build = Join-Path $root 'build'
          New-Item -ItemType Directory -Path $build -Force | Out-Null
          $dll = Join-Path $build 'AvernesTreiner.dll'
          $sources = @(Get-ChildItem $src -Filter '*.cs' -Recurse -File | ForEach-Object { $_.FullName })
          if ($sources.Count -ne 16) { throw "Expected 16 retained C# source files, found $($sources.Count)." }
          $removedFeatureHits = Select-String -Path $sources -Pattern 'NoClip|No-Clip|SET_ENTITY_VELOCITY|SET_ENTITY_GRAVITY|SET_ENTITY_HAS_GRAVITY'
          if ($removedFeatureHits) { throw 'NoClip/Power-Vision code or related entity velocity/gravity calls remain.' }
          $references = @(
            "/reference:$(Join-Path $ref 'mscorlib.dll')",
            "/reference:$env:SHVDN2_DLL", "/reference:$env:NATIVEUI_DLL",
            "/reference:$(Join-Path $ref 'System.dll')",
            "/reference:$(Join-Path $ref 'System.Core.dll')",
            "/reference:$(Join-Path $ref 'System.Drawing.dll')",
            "/reference:$(Join-Path $ref 'System.Windows.Forms.dll')",
            "/reference:$(Join-Path $ref 'System.Web.Extensions.dll')",
            "/reference:$(Join-Path $ref 'Microsoft.CSharp.dll')"
          )
          & $csc /noconfig /nostdlib /target:library /platform:anycpu /optimize+ "/out:$dll" $references $sources
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed: exit code $LASTEXITCODE." }
          if (-not (Test-Path $dll) -or (Get-Item $dll).Length -lt 10000) { throw 'Compiled DLL is missing or unexpectedly small.' }
          Get-FileHash $dll -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - name: Validate resources and build v0.9.1 installer ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD
          $stage = Join-Path $env:RUNNER_TEMP 'AvernesTreiner-install'
          $payload = Join-Path $stage 'files'
          $runtime = Join-Path $payload 'scripts\AvernesTreiner'
          $scripts = Join-Path $payload 'scripts'
          $zip = Join-Path $PWD 'AvernesTreiner-0.9.1-GTA5-Legacy.zip'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          Copy-Item -Path (Join-Path $root 'resources\*') -Destination $runtime -Recurse
          foreach ($userFile in @('Config.ini','SavedVehicles.json','WeaponInventory.json','addons.json')) {
            $userPath = Join-Path $runtime $userFile
            if (Test-Path $userPath) { Remove-Item $userPath -Force }
          }
          Copy-Item (Join-Path $root 'build\AvernesTreiner.dll') -Destination $scripts
          Copy-Item (Join-Path $root 'installer\INSTALL.bat') -Destination $stage
          Copy-Item (Join-Path $root 'installer\UNINSTALL.bat') -Destination $stage
          Copy-Item (Join-Path $root 'installer\README.txt') -Destination $stage
          $required = @('INSTALL.bat','UNINSTALL.bat','README.txt','files\scripts\AvernesTreiner.dll','files\scripts\AvernesTreiner\Languages\en-US.ini','files\scripts\AvernesTreiner\Languages\ru-RU.ini')
          foreach ($f in $required) { if (-not (Test-Path (Join-Path $stage $f))) { throw "Missing installer file: $f" } }
          $english = Get-Content (Join-Path $runtime 'Languages\en-US.ini') -Raw
          $russian = Get-Content (Join-Path $runtime 'Languages\ru-RU.ini') -Raw
          if ($english -notmatch 'MenuSubtitle=v0.9.1' -or $russian -notmatch 'MenuSubtitle=v0.9.1') { throw 'Both language files must identify v0.9.1.' }
          $englishKeys = [regex]::Matches($english, '(?m)^([^=\r\n]+)=') | ForEach-Object { $_.Groups[1].Value }
          $russianKeys = [regex]::Matches($russian, '(?m)^([^=\r\n]+)=') | ForEach-Object { $_.Groups[1].Value }
          $missingRussian = @($englishKeys | Where-Object { $_ -notin $russianKeys })
          if ($missingRussian.Count -gt 0) { throw ('Russian localization is missing keys: ' + ($missingRussian -join ', ')) }
          $missingEnglish = @($russianKeys | Where-Object { $_ -notin $englishKeys })
          if ($missingEnglish.Count -gt 0) { throw ('English localization is missing keys: ' + ($missingEnglish -join ', ')) }
          foreach ($userFile in @('Config.ini','SavedVehicles.json','WeaponInventory.json','addons.json')) {
            if (Test-Path (Join-Path $runtime $userFile)) { throw "User data must not be shipped: $userFile" }
          }
          $installerSource = Get-Content (Join-Path $root 'installer\INSTALL.bat') -Raw
          if ($installerSource -notmatch 'AvernesTrainer_Backup' -or $installerSource -notmatch 'AvernesTreiner_Backup' -or $installerSource -notmatch 'USERDATA' -or $installerSource -notmatch "GetFolderPath\('MyDocuments'\)") { throw 'Installer legacy backup migration or Windows My Documents path is missing.' }
          # Audit guard: the localization parser must preserve intentional suffix spaces.
          $configSource = Get-Content (Join-Path $root 'src\Core\ConfigManager.cs') -Raw
          if ($configSource -notmatch 'rawLine\.TrimStart' -or $configSource -notmatch 'Substring\(separator \+ 1\)\.TrimStart\(\)') { throw 'Localization parser must preserve intentional trailing spaces in values.' }
          if ($configSource -notmatch 'Version=v0.9.1' -or $configSource -notmatch 'ResolveUserDataDirectory' -or $configSource -notmatch 'UserDataDirectoryPath' -or $configSource -notmatch 'Persist feature toggles immediately' -or $configSource -notmatch '\.bak' -or $configSource -notmatch 'File.Copy\(backupPath, _configPath, true\)') { throw 'Persistent settings, immediate saves or missing-config backup recovery are missing.' }
          $core = Get-Content (Join-Path $root 'src\Core\AvernesTreiner.cs') -Raw
          if ($core -notmatch 'ControlDisablingEnabled = false' -or $core -notmatch 'Keys\.Escape' -or $core -notmatch 'CloseAllMenus') { throw 'Menu control/Escape behavior is missing.' }
          if ($core -notmatch 'MouseControlsEnabled = false' -or $core -match 'UseCursor = false|_SHOW_CURSOR_THIS_FRAME') { throw 'NativeUI cursor must remain disabled.' }
          $vehicleSource = Get-Content (Join-Path $root 'src\Modules\VehicleModule.cs') -Raw
          foreach ($requiredToken in @('RestoreDriftMode','SET_ENTITY_PROOFS','SET_VEHICLE_TYRES_CAN_BURST','SET_VEHICLE_DEFORMATION_FIXED','SET_VEHICLE_STRONG','SET_VEHICLE_FIXED','SET_VEHICLE_ENGINE_HEALTH','SET_VEHICLE_BODY_HEALTH','Auto Repair on Entry','Keys.NumPad0','GET_MISSION_FLAG','DELETE_VEHICLE')) {
            if ($vehicleSource -notmatch [regex]::Escape($requiredToken)) { throw "Vehicle behavior check missing: $requiredToken" }
          }
          if ($vehicleSource -match 'SET_DONT_PROCESS_VEHICLE_GLASS|0x1087BC8EC540DAEB|IsPersistent\s*=\s*false\s*;\s*vehicle\.Delete') { throw 'Unsafe or obsolete vehicle protection/cleanup code found.' }
          if ($vehicleSource -notmatch '0x4E20D2A627011E8E' -or $vehicleSource -notmatch 'enabled \? 0\.0f : 1\.0f') { throw 'Vehicle God Mode damage-scale protection is missing.' }
          foreach ($cleanupToken in @('_vehicleDeletionQueue','ProcessNextVehicleDeletion','QueueVehicleDeletion','_protectedSavedVehicles','DOES_ENTITY_EXIST','GET_PED_IN_VEHICLE_SEAT','CleanupExplodedSpawnedVehicles','IS_ENTITY_DEAD','GET_VEHICLE_ENGINE_HEALTH')) { if ($vehicleSource -notmatch [regex]::Escape($cleanupToken)) { throw "Spawned vehicle cleanup verification missing: $cleanupToken" } }
          if ($core -notmatch 'DisableMenuNavigationControls' -or $core -notmatch 'DISABLE_CONTROL_ACTION' -or $core -notmatch 'EnableGameplayControls' -or $core -notmatch 'ENABLE_ALL_CONTROL_ACTIONS') { throw 'Menu navigation/camera controls regression checks failed.' }
          $settingsSource = Get-Content (Join-Path $root 'src\Modules\SettingsModule.cs') -Raw
          if ($settingsSource -notmatch 'languageItem' -or $settingsSource -notmatch 'ConfigManager.Save' -or $settingsSource -notmatch 'Localization.LoadLanguage' -or $settingsSource -notmatch '_requestMenuRebuild' -or $settingsSource -match 'languageItem.Index\s*=|unitItem.Index\s*=') { throw 'Live language switching or safe settings reload behavior is missing.' }
          $teleportSource = Get-Content (Join-Path $root 'src\Modules\TeleportModule.cs') -Raw
          if ($teleportSource -notmatch 'SafeCoordProbeHeights' -or $teleportSource -notmatch 'result, true, false' -or $teleportSource -notmatch 'TryGetGroundHeight' -or $teleportSource -notmatch 'GET_GROUND_Z_FOR_3D_COORD' -or $teleportSource -notmatch 'REQUEST_COLLISION_AT_COORD' -or $teleportSource -notmatch 'NEW_LOAD_SCENE_START' -or $teleportSource -notmatch 'GetSafeCoordForPed' -or $teleportSource -notmatch 'SET_ENTITY_COORDS_NO_OFFSET' -or $teleportSource -notmatch 'streamingReady' -or $teleportSource -notmatch '_waypointTargetHandle' -or $teleportSource -notmatch 'TeleportEntity' -or $teleportSource -notmatch 'GET_VEHICLE_CLASS' -or $teleportSource -notmatch 'SET_VEHICLE_ON_GROUND_PROPERLY') { throw 'Waypoint streaming fallback or land-vehicle placement checks failed.' }
          $playerSource = Get-Content (Join-Path $root 'src\Modules\PlayerModule.cs') -Raw
          if ($playerSource -notmatch 'SET_MAX_WANTED_LEVEL' -or $playerSource -notmatch 'CLEAR_PLAYER_WANTED_LEVEL' -or $playerSource -notmatch 'EnableNeverWanted' -or $playerSource -match '_copsIgnore|CopsIgnore') { throw 'Never Wanted regression checks failed or the redundant Cops Ignore feature remains.' }
          if ($playerSource -notmatch '_infiniteSpecialAbility' -or $playerSource -notmatch 'SPECIAL_ABILITY_FILL_METER' -or $playerSource -notmatch 'IS_SPECIAL_ABILITY_ACTIVE' -or $playerSource -notmatch 'IS_SPECIAL_ABILITY_METER_FULL' -or $playerSource -match 'SPECIAL_ABILITY_CHARGE_NORMALIZED|IS_PLAYER_FREE_AIMING|SET_PLAYER_SIMULATE_AIMING' -or $playerSource -notmatch 'SPECIAL_ABILITY_UNLOCK' -or $playerSource -notmatch 'InfiniteSpecialAbility') { throw 'Special ability refill must use meter fill/unlock only, without aiming simulation.' }
          foreach ($skill in @('SPECIAL_ABILITY_UNLOCKED','STAMINA','SHOOTING_ABILITY','STRENGTH','STEALTH_ABILITY','FLYING_ABILITY','WHEELIE_ABILITY','LUNG_CAPACITY')) { if ($playerSource -notmatch ('"' + [regex]::Escape($skill) + '"')) { throw "Max-stat skill missing: $skill" } }
          foreach ($maxed in @('SPECIAL_ABILITY_MAXED','STAMINA_MAXED','SHOOTING_ABILITY_MAXED','STRENGTH_MAXED','STEALTH_ABILITY_MAXED','FLYING_ABILITY_MAXED','WHEELIE_ABILITY_MAXED','LUNG_CAPACITY_MAXED')) { if ($playerSource -notmatch ('"' + [regex]::Escape($maxed) + '"')) { throw "Max-stat completion flag missing: $maxed" } }
          if ($playerSource -notmatch 'SP0_' -or $playerSource -notmatch 'SP1_' -or $playerSource -notmatch 'SP2_' -or $playerSource -notmatch 'CharacterStatPrefixes' -or $playerSource -notmatch 'STAT_SET_INT' -or $playerSource -notmatch 'STAT_GET_INT' -or $playerSource -notmatch 'STAT_SET_BOOL' -or $playerSource -notmatch 'STAT_GET_BOOL' -or $playerSource -notmatch 'OutputArgument' -or $playerSource -notmatch 'Hash.GET_HASH_KEY' -or $playerSource -notmatch 'GetCharacterStatPrefix' -or $playerSource -notmatch 'MaxAllStatsEnabled' -or $playerSource -notmatch 'GET_ENTITY_MODEL' -or $playerSource -notmatch 'true\);') { throw 'Max all character stats persistence and character-switch checks failed.' }
          foreach ($languageFile in @($english, $russian)) { foreach ($key in @('InfiniteSpecialAbility','InfiniteSpecialAbilityDesc','MaxAllStats','MaxAllStatsDesc')) { if ($languageFile -notmatch ('(?m)^' + $key + '=')) { throw "Missing localization key: $key" } } }
          foreach ($languageFile in @($english, $russian)) { if ($languageFile -match '(?m)^CopsIgnore(?:Desc)?=') { throw 'Removed Cops Ignore localization keys remain.' } }
          $weaponSource = Get-Content (Join-Path $root 'src\Modules\WeaponModule.cs') -Raw
          if ($weaponSource -notmatch 'DOES_WEAPON_TAKE_WEAPON_COMPONENT' -or $weaponSource -notmatch 'GIVE_WEAPON_COMPONENT_TO_PED') { throw 'Weapon attachment regression checks failed.' }
          if ($weaponSource -notmatch '_infiniteAmmo \|\| _infiniteClip' -or $weaponSource -notmatch 'characterChanged' -or $weaponSource -notmatch 'SET_PED_INFINITE_AMMO_CLIP') { throw 'Weapon ammo options must be reapplied to the active character.' }
          foreach ($ammoToken in @('GET_SELECTED_PED_WEAPON','GET_PED_AMMO_TYPE_FROM_WEAPON','GET_PED_AMMO_BY_TYPE','ADD_PED_AMMO_BY_TYPE','SET_PED_AMMO_BY_TYPE','0x585847C5E4E11709','GET_AMMO_IN_CLIP','MAKE_PED_RELOAD','REFILL_AMMO_INSTANTLY')) { if ($weaponSource -notmatch [regex]::Escape($ammoToken)) { throw "DLC/Mk II infinite ammo type handling missing: $ammoToken" } }
          if ($weaponSource -match 'player\.Weapons\.Current\.Ammo\s*=') { throw 'Infinite ammo must use the active ammo-type pool, not the base weapon ammo setter.' }
          foreach ($inventoryToken in @('WeaponInventory.json','MaintainStoryModeWeaponInventory','CaptureWeaponInventory','RestoreWeaponInventory','GIVE_WEAPON_TO_PED','HAS_PED_GOT_WEAPON','SET_PED_WEAPON_TINT_INDEX','SP0','SP1','SP2')) { if ($weaponSource -notmatch [regex]::Escape($inventoryToken)) { throw "Story Mode weapon persistence check missing: $inventoryToken" } }
          if ($weaponSource -match 'SetSuperJumpThisFrame' -or $weaponSource -notmatch 'SET_PLAYER_WEAPON_DAMAGE_MODIFIER') { throw 'Super Damage must not trigger Super Jump and must restore its weapon damage modifier.' }
          $vehicleDatabase = Get-Content (Join-Path $root 'src\Modules\VehicleDatabase.cs') -Raw
          $databaseModels = [regex]::Matches($vehicleDatabase, '"[a-z0-9_]+"', [System.Text.RegularExpressions.RegexOptions]::Multiline)
          if ($databaseModels.Count -ne 246) { throw "Expected 246 additional vehicle models, found $($databaseModels.Count)." }
          foreach ($model in @('calico','dominator7','dominator8','euros','remus','zr350','jester4','rt3000','vectre','futo2','previon','sultan3','tailgater2','comet6','growler','cypher','warrener2','astron','buffalo4','champion','cinquemila','deity','ignus','jubilee','zeno','baller7','patriot3','comet7','shinobi','iwagen','granger2','reever','mule5')) {
            if ($vehicleDatabase -match ('"' + $model + '"')) { throw "Post-1.0.2245.0 vehicle model found: $model" }
          }
          $skinSource = Get-Content (Join-Path $root 'src\Modules\SkinChangerModule.cs') -Raw
          if ($skinSource -notmatch '_originalModelHash == 0' -or $skinSource -notmatch 'model\.IsLoaded') { throw 'Skin changer must preserve the original protagonist and wait for model loading.' }
          $animationSource = Get-Content (Join-Path $root 'src\Modules\AnimationModule.cs') -Raw
          if ($animationSource -notmatch 'ScenarioStarted' -or $animationSource -match 'Executando') { throw 'Animation notifications must use localization, not stray Portuguese text.' }
          $savedVehiclesSource = Get-Content (Join-Path $root 'src\Modules\SavedVehiclesModule.cs') -Raw
          if ($savedVehiclesSource -notmatch 'CaptureVehicle' -or $savedVehiclesSource -notmatch 'ApplyCustomization' -or $savedVehiclesSource -notmatch 'SavedVehicles.json' -or $core -notmatch 'new SavedVehiclesModule\(\)') { throw 'Saved vehicle save/spawn registration checks failed.' }
          if ($vehicleSource -match '_stuckCounter' -or $vehicleSource -notmatch '_lastTrafficRammerCheckTime') { throw 'Autopilot tick-throttling check failed.' }
          if ($vehicleSource -notmatch '_missionSpawnedVehicles' -or $vehicleSource -notmatch '_missionCleanupTrackingActive' -or $vehicleSource -notmatch 'trackedEntry' -or $vehicleSource -notmatch 'Mission vehicles are queued as soon as the mission ends') { throw 'Mission-start vehicle snapshot and cleanup are missing.' }
          if ($core -notmatch 'BuildMenus\(\)' -or $core -notmatch '_rebuildMenuRequested' -or $core -notmatch '_modules\[i\]\.ReloadSettings\(\)') { throw 'Live menu rebuild or module settings reload support is missing.' }
          $moduleContract = Get-Content (Join-Path $root 'src\Core\IAvernesModule.cs') -Raw
          if ($moduleContract -notmatch 'ReloadSettings') { throw 'Module settings reload contract is missing.' }
          $worldSource = Get-Content (Join-Path $root 'src\Modules\WorldModule.cs') -Raw
          if ($worldSource -notmatch 'PAUSE_CLOCK' -or $worldSource -notmatch 'GravityLevel' -or $worldSource -notmatch '_lastWorldSettingsApplyTime') { throw 'Loaded world settings are not reapplied.' }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 10000) { throw 'Install ZIP is unexpectedly small.' }
      - uses: actions/upload-artifact@v4
        with:
          name: AvernesTreiner-0.9.1-GTA5-Legacy
          path: AvernesTreiner-0.9.1-GTA5-Legacy.zip
          if-no-files-found: error
          retention-days: 30
