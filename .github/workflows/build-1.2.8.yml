name: YnixTrainer 1.2.8 Windows release build
on:
  push:
    branches: [work/1.2.8-development]
    paths:
      - ".github/build-input/YnixTrainer_1.2.8_BUILD_INPUT_*.b64"
      - ".github/workflows/build-1.2.8.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble source archive
        shell: pwsh
        run: |
          $chunks = Get-ChildItem ".github/build-input/YnixTrainer_1.2.8_BUILD_INPUT_*.b64" | Sort-Object Name
          if ($chunks.Count -ne 10) { throw "Expected 10 chunks; found $($chunks.Count)." }
          $encoded = ($chunks | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "ynix-source.tar.gz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $extract = Join-Path $env:RUNNER_TEMP "ynix-source"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          tar -xzf $archive -C $extract
          $root = Join-Path $extract "AvernesSowtware_v1.2.8"
          if (-not (Test-Path (Join-Path $root "BUILD_RELEASE.bat"))) { throw "Missing BUILD_RELEASE.bat." }
          "YNIX_PROJECT_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Get ScriptHookVDotNet2 reference assembly
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "shvdn2.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP "shvdn2.zip"
          $dest = Join-Path $env:RUNNER_TEMP "shvdn2"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13" -OutFile $pkg
          Copy-Item $pkg $zip -Force
          Expand-Archive $zip $dest -Force
          $dll = Get-ChildItem $dest -Recurse -Filter "ScriptHookVDotNet2.dll" | Select-Object -First 1
          if (-not $dll) { throw "SHVDN2 2.10.13 DLL was not found." }
          "YNIX_SHVDN_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and validate full release
        shell: pwsh
        run: |
          $root = $env:YNIX_PROJECT_ROOT
          $game = Join-Path $env:RUNNER_TEMP "GTA5-build-target"
          New-Item -ItemType Directory -Path $game -Force | Out-Null
          Push-Location $root
          try {
            & $env:ComSpec /d /c ('call "{0}" "{1}" --no-pause' -f (Join-Path $root "BUILD_RELEASE.bat"), $game)
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path "BUILD_RELEASE.log") { Get-Content "BUILD_RELEASE.log" }
              if (Test-Path "YniXTrainer_Build.log") { Get-Content "YniXTrainer_Build.log" }
              throw "BUILD_RELEASE.bat failed: $LASTEXITCODE"
            }
            $zips = Get-ChildItem (Join-Path $root "dist") -Recurse -Filter "*.zip" -ErrorAction SilentlyContinue
            if (-not $zips) { throw "No release ZIP was produced." }
            $release = $zips | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zr = [IO.Compression.ZipFile]::OpenRead($release.FullName)
            try {
              $names = @($zr.Entries | ForEach-Object { $_.FullName })
              if (-not ($names | Where-Object { $_ -match '(^|/)YnixTrainerExtended\.dll$' })) { throw "Compiled trainer DLL missing from release ZIP." }
              $roots = @($names | Where-Object { $_ } | ForEach-Object { ($_ -split '/')[0] } | Sort-Object -Unique)
              if ($roots.Count -ne 1 -or $roots[0] -ne "AvernesSowtware_v1.2.8") { throw "Bad archive root: $($roots -join ', ')." }
              if ($zr.Entries | Where-Object { $_.Length -eq 0 -and -not $_.FullName.EndsWith("/") }) { throw "Release ZIP has empty files." }
              Write-Host "RELEASE ZIP VALID: $($release.FullName); entries=$($names.Count)"
            } finally { $zr.Dispose() }
            New-Item "release-artifact" -ItemType Directory -Force | Out-Null
            Copy-Item $release.FullName "release-artifact/AvernesSowtware_v1.2.8_RELEASE.zip" -Force
          } finally { Pop-Location }
      - name: Upload full 1.2.8 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.2.8-RELEASE
          path: release-artifact/AvernesSowtware_v1.2.8_RELEASE.zip
          if-no-files-found: error
          retention-days: 14
