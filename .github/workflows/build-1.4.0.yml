name: AvernesSowtware 1.4.0 Windows build
on:
  push:
    branches: [work/1.4.0-build]
    paths:
      - '.github/build-input/patches_1_4_0.part*.b64'
      - '.github/workflows/build-1.4.0.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 1.3.9 baseline
        uses: actions/download-artifact@v4
        with:
          name: AvernesSowtware-v1.3.9-RELEASE
          path: ${{ runner.temp }}/base
          repository: ${{ github.repository }}
          run-id: 43847548817
          github-token: ${{ github.token }}
      - name: Reconstruct and apply verified patch
        shell: pwsh
        run: |
          $env:PATCH_OUT = Join-Path $env:RUNNER_TEMP 'v140.patch'
          @'
          import base64,gzip,hashlib,os
          from pathlib import Path
          d=Path(os.environ['GITHUB_WORKSPACE'])/'.github'/'build-input'
          parts=sorted(d.glob('patches_1_4_0.part*.b64'))
          if len(parts)!=4: raise SystemExit(f'Expected 4 patch parts, found {len(parts)}')
          packed=base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts),validate=True)
          if hashlib.sha256(packed).hexdigest()!='2ee7744894a2f7943c99775b4159a6beb5813528113c4f4a392dc50f8068ea48': raise SystemExit('Patch archive SHA mismatch')
          raw=gzip.decompress(packed)
          if hashlib.sha256(raw).hexdigest()!='a42c0f0423f9714639d1397d7028c13489b8e4cfc5b3f2bc3d76326e015ab2c3': raise SystemExit('Patch SHA mismatch')
          Path(os.environ['PATCH_OUT']).write_bytes(raw)
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'patch.py') -Encoding UTF8
          python (Join-Path $env:RUNNER_TEMP 'patch.py')
          if ($LASTEXITCODE -ne 0) { throw 'Patch verification failed.' }
          $zip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'base') -Filter 'AvernesSowtware_v1.3.9_RELEASE.zip' -Recurse | Select-Object -First 1
          if (-not $zip) { throw '1.3.9 baseline ZIP missing.' }
          $extract = Join-Path $env:RUNNER_TEMP 'src140'
          Expand-Archive $zip.FullName $extract -Force
          $old = Join-Path $extract 'AvernesSowtware_v1.3.9'
          $root = Join-Path $extract 'AvernesSowtware_v1.4.0'
          if (-not (Test-Path $old)) { throw 'Unexpected baseline ZIP root.' }
          Move-Item $old $root
          git -C $root init -q
          git -C $root apply --check --whitespace=nowarn $env:PATCH_OUT
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply to 1.3.9 baseline.' }
          git -C $root apply --whitespace=nowarn $env:PATCH_OUT
          if ($LASTEXITCODE -ne 0) { throw 'Patch apply failed.' }
          if (-not (Select-String (Join-Path $root 'src\Core\AvernesSowtwareScript.cs') 'ProductVersion\s*=\s*"1\.4\.0"' -Quiet)) { throw 'Source version mismatch.' }
          "AVERNE_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run 89 regression tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE='1'
          Push-Location $env:AVERNE_ROOT
          python -m unittest discover -s tests -p 'test_*.py' -v
          $code=$LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'Regression suite failed.' }
      - name: Restore ScriptHookVDotNet2 2.10.13 reference
        shell: pwsh
        run: |
          $pkg=Join-Path $env:RUNNER_TEMP 'shvdn.nupkg'; $zip=Join-Path $env:RUNNER_TEMP 'shvdn.zip'; $out=Join-Path $env:RUNNER_TEMP 'shvdn'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/ScriptHookVDotNet2/2.10.13' -OutFile $pkg
          Copy-Item $pkg $zip -Force; Expand-Archive $zip $out -Force
          $refs=@(Get-ChildItem $out -Filter ScriptHookVDotNet2.dll -Recurse -File)
          if ($refs.Count -ne 1 -or $refs[0].Length -lt 4096) { throw 'SHVDN API2 reference invalid.' }
          "AVERNE_SHVDN_DLL=$($refs[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile release
        shell: pwsh
        run: |
          Push-Location $env:AVERNE_ROOT
          & cmd.exe /d /c 'BUILD_RELEASE.bat "" --no-pause'
          $code=$LASTEXITCODE
          if (Test-Path 'AvernesSowtware_Build.log') { if ((Get-Content 'AvernesSowtware_Build.log' -Raw) -match 'warning CS\d+') { throw 'C# compiler warnings found.' } }
          if ($code -ne 0 -or !(Test-Path 'dist\AvernesSowtware.dll') -or !(Test-Path 'dist\AvernesSowtware_v1.4.0_RELEASE.zip')) { throw 'Release compilation/package failed.' }
          Pop-Location
      - name: Test installer and validate archive
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:AVERNE_ROOT 'build\Test-InstallerIdempotence.ps1') -ProjectRoot $env:AVERNE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Installer migration/idempotence test failed.' }
          $path=Join-Path $env:AVERNE_ROOT 'dist\AvernesSowtware_v1.4.0_RELEASE.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($path)
          try {
            $n=@($z.Entries | ForEach-Object {$_.FullName.Replace([char]92,'/')})
            if ($n[0] -ne 'AvernesSowtware_v1.4.0/Install_AvernesSowtware.bat') { throw 'Installer is not first.' }
            $dll=@($n | Where-Object {$_ -match '\.dll$'})
            if ($dll.Count -ne 1 -or $dll[0] -ne 'AvernesSowtware_v1.4.0/dist/AvernesSowtware.dll') { throw 'Expected exactly one trainer DLL.' }
            if (@($n | Where-Object {$_ -match '/(tests|\.github)/|(__pycache__/|\.py[co]$)' }).Count) { throw 'Development files leaked into installer.' }
            foreach($f in @('docs/CHANGELOG_1_4_0_RU.md','docs/TEST_REPORT_1_4_0_RU.md','vehicle_catalog.json','Vehicles/vehicles.json','addons.json')) { if (@($n | Where-Object {$_ -like "*/$f"}).Count -eq 0) { throw "Missing $f" } }
          } finally { $z.Dispose() }
          $verify=Join-Path $env:RUNNER_TEMP 'zipcheck'; Expand-Archive $path $verify -Force
          $r=Join-Path $verify 'AvernesSowtware_v1.4.0'
          $a=Get-Content -Raw (Join-Path $r 'package\AvernesSowtware\vehicle_catalog.json') | ConvertFrom-Json
          $b=Get-Content -Raw (Join-Path $r 'package\AvernesSowtware\Vehicles\vehicles.json') | ConvertFrom-Json
          $c=Get-Content -Raw (Join-Path $r 'package\AvernesSowtware\addons.json') | ConvertFrom-Json
          $u=@($a+$c | ForEach-Object {$_.model.ToLowerInvariant()} | Sort-Object -Unique)
          if (@($a).Count -ne 480 -or @($b).Count -ne 480 -or @($c).Count -ne 85 -or $u.Count -ne 545) { throw 'Vehicle catalog counts mismatch.' }
      - name: Upload 1.4.0 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvernesSowtware-v1.4.0-RELEASE
          path: ${{ env.AVERNE_ROOT }}/dist/AvernesSowtware_v1.4.0_RELEASE.zip
          if-no-files-found: error
          retention-days: 14